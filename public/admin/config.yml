backend:
  name: github
  repo: timviney/artist-portfolio
  branch: main

# Images the artist uploads land here and are served from /images/uploads
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ---------------------------------------------------------------- settings
  - name: settings
    label: Settings
    files:
      - name: site
        label: Site settings
        file: content/settings/site.json
        fields:
          - name: name
            label: Artist name
            widget: string
          - name: tagline
            label: Tagline
            widget: string
            required: false
          - name: socialLinks
            label: Social links
            widget: list
            required: false
            fields:
              - name: label
                label: Label
                widget: string
              - name: url
                label: URL
                widget: string
          - name: cv
            label: CV (PDF download shown in the header)
            widget: file
            required: false

      - name: theme
        label: Theme
        file: content/settings/theme.json
        fields:
          - name: preset
            label: Theme preset
            widget: select
            options:
              - chocolate truffle
              - salt and pepper
              - tropical punch
              - yacht club
              - lavender fields
              - stormy morning
            default: chocolate truffle
            hint: Named colour/font themes.

  # ------------------------------------------------------------------- pages
  - name: pages
    label: Pages
    files:
      - name: home
        label: Home
        file: content/pages/home.json
        fields:
          - name: actorHeadshot
            label: Actor tile image
            widget: image
            required: false
          - name: actorHeadshotFocus
            label: Actor tile crop focus
            widget: object
            required: false
            collapsed: true
            hint: >-
              Nudge which part of the photo stays visible when the site crops
              it to fit. A lower vertical value shows more of the top of the
              photo (e.g. a face). Leave blank to keep the photo centred.
            fields: &focus-axis-fields
              - name: x
                label: Horizontal position (0 left - 100 right)
                widget: number
                required: false
                min: 0
                max: 100
                step: 1
              - name: y
                label: Vertical position (0 top - 100 bottom)
                widget: number
                required: false
                min: 0
                max: 100
                step: 1
          - name: musicianHeadshot
            label: Musician tile image
            widget: image
            required: false
          - name: musicianHeadshotFocus
            label: Musician tile crop focus
            widget: object
            required: false
            collapsed: true
            hint: See the actor tile crop focus.
            fields: *focus-axis-fields

      - name: about
        label: About Me
        file: content/pages/about.json
        fields:
          - name: aboutEyebrow
            label: Small line above the title
            widget: string
            default: The person behind the work
          - name: aboutHeading
            label: Page title
            widget: string
            default: About Me
          - name: portraitImage
            label: Portrait photo
            widget: image
            required: false
          - name: portraitFocus
            label: Portrait crop focus
            widget: object
            required: false
            collapsed: true
            hint: See the Home page crop focus.
            fields: *focus-axis-fields
          - name: bioParagraphs
            label: Bio paragraphs
            widget: list
            required: false
          - name: statement
            label: Personal statement
            widget: text
            required: false

      - name: contact
        label: Contact
        file: content/pages/contact.json
        fields:
          - name: contactEyebrow
            label: Small line above the title
            widget: string
            default: Bookings & enquiries
          - name: contactHeading
            label: Page title
            widget: string
            default: Contact
          - name: enquiryButtonLabel
            label: Enquiry button text
            widget: string
            default: Enquire by email
          - name: contactImage
            label: Photo
            widget: image
            required: false
          - name: contactImageFocus
            label: Photo crop focus
            widget: object
            required: false
            collapsed: true
            hint: See the Home page crop focus.
            fields: *focus-axis-fields
          - name: email
            label: Email address
            widget: string
          - name: phone
            label: Phone number
            widget: string
            required: false
            hint: Shown as a tappable link; leave blank to hide.
          - name: note
            label: Note
            widget: text
            required: false
            hint: Overrides the default "replies go to my email" line.

      - name: actor
        label: Actor page
        file: content/pages/actor.json
        fields:
          - name: heroImage
            label: Hero image
            widget: image
            required: false
          - name: heroFocus
            label: Hero crop focus
            widget: object
            required: false
            collapsed: true
            hint: See the Home page crop focus.
            fields: *focus-axis-fields
          - name: actorHeading
            label: Hero title
            widget: string
            default: Actor
          - name: heroCaption
            label: Hero caption
            widget: string
            default: Stage & screen
            hint: Small letterspaced line under the big hero title.
          - name: galleryHeading
            label: Gallery title
            widget: string
            default: Gallery
          - name: headshotCaption
            label: Headshot caption
            widget: string
            default: Headshots
            hint: Small credit line under the headshot carousel.

      - name: musician
        label: Musician page
        file: content/pages/musician.json
        fields:
          - name: heroImage
            label: Hero image
            widget: image
            required: false
          - name: heroFocus
            label: Hero crop focus
            widget: object
            required: false
            collapsed: true
            hint: See the Home page crop focus.
            fields: *focus-axis-fields
          - name: intro
            label: Intro
            widget: text
          - name: musicianHeading
            label: Hero title
            widget: string
            default: Musician
          - name: heroCaption
            label: Hero caption
            widget: string
            default: Cello · Guitar · Song
            hint: Small letterspaced line under the big hero title.
          - name: awardsHeading
            label: Awards title
            widget: string
            default: Awards
          - name: awardsText
            label: Awards text
            widget: text
            required: false
          - name: awardsFirstImage
            label: Awards photo 1
            widget: image
            required: false
          - name: awardsFirstImageFocus
            label: Awards photo 1 crop focus
            widget: object
            required: false
            collapsed: true
            hint: See the Home page crop focus.
            fields: *focus-axis-fields
          - name: awardsSecondImage
            label: Awards photo 2
            widget: image
            required: false
          - name: awardsSecondImageFocus
            label: Awards photo 2 crop focus
            widget: object
            required: false
            collapsed: true
            hint: See the Home page crop focus.
            fields: *focus-axis-fields
          - name: highlightsHeading
            label: Highlights title
            widget: string
            default: Highlights
          - name: projectsHeading
            label: Original projects title
            widget: string
            default: Original Projects
          - name: galleryHeading
            label: Gallery title
            widget: string
            default: Gallery

  # ------------------------------------------------------------ actor: media
  - name: actor-videos
    label: Actor · Showreel videos
    folder: content/actor/videos
    format: json
    create: true
    identifier_field: title
    summary: '{{title}}'
    sortable_fields:
      - dateAdded
      - title
    fields:
      - name: title
        label: Title
        widget: string
      - name: videoUrl
        label: Video URL
        widget: string
        required: false
        hint: Paste a YouTube or Vimeo page link; it is embedded on the site.
      - name: description
        label: Description
        widget: markdown
        required: false
        hint: Use the link button for credits, e.g. [Photographer](https://example.com).
      - name: dateAdded
        label: Date added
        widget: datetime
        required: false
        hint: Newest entries show first. New entries are dated now; tweak a date to re-order.

  - name: actor-headshots
    label: Actor · Headshots
    folder: content/actor/headshots
    format: json
    create: true
    identifier_field: alt
    summary: '{{alt}}'
    sortable_fields:
      - dateAdded
      - alt
    fields:
      - name: image
        label: Photo
        widget: image
        required: false
      - name: focus
        label: Crop focus
        widget: object
        required: false
        collapsed: true
        hint: >-
          Nudge which part of the photo stays visible when the site crops it.
          A lower vertical value shows more of the top of the photo (e.g. a
          face). Leave blank to keep the photo centred.
        fields: *focus-axis-fields
      - name: alt
        label: Alt text
        widget: string
        required: false
        hint: Describe the photo for screen readers.
      - name: dateAdded
        label: Date added
        widget: datetime
        required: false
        hint: Newest entries show first. New entries are dated now; tweak a date to re-order.

  - name: actor-gallery
    label: Actor · Production gallery
    folder: content/actor/gallery
    format: json
    create: true
    identifier_field: title
    summary: '{{title}}'
    sortable_fields:
      - dateAdded
      - title
    fields:
      - name: image
        label: Photo
        widget: image
        required: false
      - name: focus
        label: Crop focus
        widget: object
        required: false
        collapsed: true
        hint: See the Actor headshots crop focus.
        fields: *focus-axis-fields
      - name: title
        label: Caption title
        widget: markdown
        hint: Use the link button for credits, e.g. [Photographer](https://example.com).
      - name: dateAdded
        label: Date added
        widget: datetime
        required: false
        hint: Newest entries show first. New entries are dated now; tweak a date to re-order.

  # --------------------------------------------------------- musician: media
  - name: musician-highlights
    label: Musician · Highlights
    folder: content/musician/highlights
    format: json
    create: true
    identifier_field: title
    summary: '{{title}}'
    sortable_fields:
      - dateAdded
      - title
    fields:
      - name: title
        label: Title
        widget: string
      - name: videoUrl
        label: Video URL
        widget: string
        required: false
        hint: Paste a YouTube or Vimeo page link; it is embedded on the site.
      - name: description
        label: Description
        widget: markdown
        required: false
        hint: Use the link button for credits, e.g. [Photographer](https://example.com).
      - name: dateAdded
        label: Date added
        widget: datetime
        required: false
        hint: Newest entries show first. New entries are dated now; tweak a date to re-order.

  - name: musician-projects
    label: Musician · Original projects
    folder: content/musician/projects
    format: json
    create: true
    identifier_field: title
    summary: '{{title}}'
    sortable_fields:
      - dateAdded
      - title
    fields:
      - name: title
        label: Title
        widget: string
      - name: videoUrl
        label: Video URL
        widget: string
        required: false
        hint: Paste a YouTube or Vimeo page link; it is embedded on the site.
      - name: description
        label: Description
        widget: markdown
        required: false
        hint: Use the link button for credits, e.g. [Photographer](https://example.com).
      - name: dateAdded
        label: Date added
        widget: datetime
        required: false
        hint: Newest entries show first. New entries are dated now; tweak a date to re-order.

  - name: musician-gallery
    label: Musician · Gallery
    folder: content/musician/gallery
    format: json
    create: true
    identifier_field: description
    summary: '{{description}}'
    sortable_fields:
      - dateAdded
      - description
    fields:
      - name: image
        label: Photo
        widget: image
        required: false
      - name: focus
        label: Crop focus
        widget: object
        required: false
        collapsed: true
        hint: See the Actor headshots crop focus.
        fields: *focus-axis-fields
      - name: description
        label: Description
        widget: markdown
        required: false
        hint: Use the link button for credits, e.g. [Photographer](https://example.com).
      - name: dateAdded
        label: Date added
        widget: datetime
        required: false
        hint: Newest entries show first. New entries are dated now; tweak a date to re-order.
